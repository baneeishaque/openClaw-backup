<svg xmlns="http://www.w3.org/2000/svg" width="780" height="560" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" viewBox="0 0 780 560"><rect width="780" height="560" fill="#fff"/><text x="390" y="35" fill="#1e1e1e" font-size="24" font-weight="600" text-anchor="middle">What Subagents Actually See</text><rect width="260" height="60" x="250" y="65" fill="#b2f2bb" stroke="#22c55e" stroke-width="2" rx="10"/><text x="380" y="102" fill="#1e1e1e" font-size="20" font-weight="600" text-anchor="middle">AGENTS.md</text><text x="380" y="145" fill="#22c55e" font-size="13" text-anchor="middle">Loaded automatically by every agent</text><defs><marker id="arrow-green" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#22c55e" points="0 0 10 3.5 0 7"/></marker><marker id="arrow-amber-up" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#f59e0b" points="0 0 10 3.5 0 7"/></marker></defs><line x1="310" x2="155" y1="125" y2="235" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green)"/><line x1="380" x2="380" y1="125" y2="235" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green)"/><line x1="450" x2="615" y1="125" y2="235" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green)"/><rect width="170" height="50" x="50" y="240" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2" rx="10"/><text x="135" y="271" fill="#1e1e1e" font-size="17" font-weight="500" text-anchor="middle">Explore</text><rect width="180" height="50" x="290" y="240" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2" rx="10"/><text x="380" y="271" fill="#1e1e1e" font-size="17" font-weight="500" text-anchor="middle">Code Review</text><rect width="170" height="50" x="540" y="240" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2" rx="10"/><text x="625" y="271" fill="#1e1e1e" font-size="17" font-weight="500" text-anchor="middle">Debug</text><text x="390" y="330" fill="#ef4444" font-size="15" font-weight="600" text-anchor="middle">What does NOT flow to subagents:</text><rect width="260" height="48" x="60" y="360" fill="#ffc9c9" stroke="#ef4444" stroke-width="2" rx="10"/><text x="190" y="390" fill="#1e1e1e" font-size="16" font-weight="500" text-anchor="middle">Conversation History</text><text x="340" y="392" fill="#ef4444" font-size="26" font-weight="700">✕</text><rect width="280" height="48" x="410" y="360" fill="#fff3bf" stroke="#f59e0b" stroke-width="2" rx="10"/><text x="550" y="390" fill="#1e1e1e" font-size="16" font-weight="500" text-anchor="middle">.agents.local.md</text><line x1="550" x2="550" y1="360" y2="300" stroke="#f59e0b" stroke-dasharray="6 4" stroke-width="2" marker-end="url(#arrow-amber-up)"/><text x="550" y="428" fill="#f59e0b" font-size="13" text-anchor="middle">Only if AGENTS.md tells them to read it</text><text x="390" y="490" fill="#1e1e1e" font-size="15" text-anchor="middle">AGENTS.md is the only shared context across all parallel agents.</text><text x="390" y="515" fill="#1e1e1e" font-size="15" text-anchor="middle">That&apos;s why instruction budget discipline matters ×5.</text></svg>